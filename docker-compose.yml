services:
  zbxtable:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.release
    image: zbxtable:local
    container_name: zbxtable
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${ZBXTABLE_HTTP_PORT:-8089}:8089"
    volumes:
      - ./config:/app/config
      - ./log:/app/log
      - ./download:/app/download
      - ./upload:/app/upload
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ZbxTable creates tables with the `zbxtable_` prefix in the database
# configured in config/app.conf. Point it at the existing Zabbix database
# when sharing a database; do not add a second MySQL service here.
