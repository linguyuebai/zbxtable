name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: canghai908/zbxtable-web
          path: zbxtable-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zbxtable-web/package-lock.json

      - name: Build and embed frontend
        working-directory: ./zbxtable-web
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci
          npm run build
          test -s web/index.html
          rm -rf ../api/v1/web/web
          mkdir -p ../api/v1/web/web
          cp -R web/. ../api/v1/web/web/

      - name: Verify embedded frontend assets
        run: |
          test -s api/v1/web/web/index.html
          test -d api/v1/web/web/js
          test -n "$(find api/v1/web/web/js -type f -name '*.js' -print -quit)"
          echo 'Embedded frontend assets are present and will be included in the source archive.'

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Run release validation
        run: |
          make install
          make vet
          make test

      - name: Build release packages
        run: |
          echo "Building release archives..."
          make package
          ZBXTABLE_VERSION="${GITHUB_REF_NAME}" ./scripts/package-release.sh
          ls -lh dist/releases
          ls -lh dist/zbxtable-*-source.tar.gz*

      - name: Generate checksums
        run: |
          cd dist/releases
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        run: |
          current_tag="${{ steps.version.outputs.version }}"
          prev_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
          {
            echo "## Release ${current_tag}"
            echo
            if [ -n "$prev_tag" ]; then
              echo "### Changes since ${prev_tag}"
              echo
              git log "${prev_tag}..${current_tag}" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "### Initial release"
              echo
              echo "- First tagged release."
            fi
            echo
            echo "### Packages"
            echo
            echo "- Linux AMD64"
            echo "- Linux ARM64"
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/releases/*.tar.gz
            dist/releases/SHA256SUMS
            dist/zbxtable-*-source.tar.gz
            dist/zbxtable-*-source.tar.gz.sha256
            scripts/install-release.sh
            scripts/install-release.ps1
            scripts/install-release.bat
            scripts/install.sh
            scripts/install.ps1
            scripts/install.bat
            scripts/bootstrap-linux.sh
            scripts/install-docker.sh
            scripts/uninstall.sh
            scripts/uninstall.ps1
            scripts/uninstall.bat
