name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: canghai908/zbxtable-web
          path: zbxtable-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zbxtable-web/package-lock.json

      - name: Build and embed frontend
        working-directory: ./zbxtable-web
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci
          npm run build
          test -s web/index.html
          rm -rf "$GITHUB_WORKSPACE/api/v1/web/web"
          mkdir -p "$GITHUB_WORKSPACE/api/v1/web/web"
          cp -R "$GITHUB_WORKSPACE/zbxtable-web/web/." "$GITHUB_WORKSPACE/api/v1/web/web/"

      - name: Verify embedded frontend assets
        run: |
          test -s api/v1/web/web/index.html
          test -n "$(find api/v1/web/web -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit)"
          echo 'Embedded frontend assets are present and will be included in the source archive.'

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Run release validation
        continue-on-error: true
        run: |
          go vet ./...
          go test ./...

      - name: Build release packages
        run: |
          echo "Building release archives..."
          safe_version="${GITHUB_REF_NAME//\//-}"
          stage="$RUNNER_TEMP/zbxtable-release"
          rm -rf "$stage" dist
          mkdir -p "$stage/zbxtable-$safe_version" dist
          tar -cf - \
            --exclude='./.git' \
            --exclude='./dist' \
            --exclude='./build' \
            --exclude='./config/app.conf' \
            --exclude='./zbxtable-web' \
            . | tar -xf - -C "$stage/zbxtable-$safe_version"
          tar -C "$stage" -czf "dist/zbxtable-$safe_version-source.tar.gz" "zbxtable-$safe_version"
          (cd dist && sha256sum "zbxtable-$safe_version-source.tar.gz") > "dist/zbxtable-$safe_version-source.tar.gz.sha256"
          ls -lh dist/zbxtable-*-source.tar.gz*

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *-source.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        run: |
          current_tag="${{ steps.version.outputs.version }}"
          prev_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
          {
            echo "## Release ${current_tag}"
            echo
            if [ -n "$prev_tag" ]; then
              echo "### Changes since ${prev_tag}"
              echo
              git log "${prev_tag}..${current_tag}" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "### Initial release"
              echo
              echo "- First tagged release."
            fi
            echo
            echo "### Packages"
            echo
            echo "- Linux AMD64"
            echo "- Linux ARM64"
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/SHA256SUMS
            dist/zbxtable-*-source.tar.gz
            dist/zbxtable-*-source.tar.gz.sha256
            scripts/install-release.sh
            scripts/install-release.ps1
            scripts/install-release.bat
            scripts/install.sh
            scripts/install.ps1
            scripts/install.bat
            scripts/bootstrap-linux.sh
            scripts/install-docker.sh
            scripts/uninstall.sh
            scripts/uninstall.ps1
            scripts/uninstall.bat
